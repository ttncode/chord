name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to build a draft release; publish it
# on GitHub after testing the installer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($version -ne $cargo) { throw "tag v$version does not match Cargo.toml version $cargo" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=$env:VERSION installer\chord.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target\installer\chord-setup-$env:VERSION.exe" dist\
          $portable = "dist\chord-v$env:VERSION-windows-x64.zip"
          Compress-Archive -Path target\release\chord.exe, chords, README.md, LICENSE, CHANGELOG.md -DestinationPath $portable
          Get-ChildItem dist | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      - name: Publish the GitHub release
        run: |
          # Release notes: this version's section of CHANGELOG.md.
          $text = Get-Content CHANGELOG.md -Raw
          $section = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)"
          if ($text -notmatch $section) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $Matches[1].Trim() | Set-Content notes.md
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist).FullName --title "chord ${{ github.ref_name }}" --notes-file notes.md --verify-tag --draft
