# Global chords work in every app. Start them with a symbol so they never clash with app chords.
name = "Global"

[chords]
"/e" = { name = "File Explorer", shortcut = "win+e" }

# Snap the window, Vim directions
"/wh" = { name = "Window: left half", shortcut = "win+left" }
"/wl" = { name = "Window: right half", shortcut = "win+right" }
"/wk" = { name = "Window: maximize", shortcut = "win+up" }
"/wj" = { name = "Window: restore / minimize", shortcut = "win+down" }

# Virtual desktops
"/dh" = { name = "Desktop: previous", shortcut = "win+ctrl+left" }
"/dl" = { name = "Desktop: next", shortcut = "win+ctrl+right" }
"/dn" = { name = "Desktop: new", shortcut = "win+ctrl+d" }
"/dx" = { name = "Desktop: close", shortcut = "win+ctrl+f4" }

# Apps: switch to the app (its next window if it's already in front), start it if it isn't running
"/a" = { name = "Antigravity", focus = "antigravity ide.exe", launch = 'start "" "%LOCALAPPDATA%\Programs\Antigravity IDE\Antigravity IDE.exe"' }
"/t" = { name = "Windows Terminal", focus = "windowsterminal.exe", launch = "wt" }

# Mouse at the pointer
"/mc" = { name = "Mouse: click", mouse = "click" }
"/mr" = { name = "Mouse: right-click", mouse = "right-click" }
"/md" = { name = "Mouse: double-click", mouse = "double-click" }
"/mj" = { name = "Mouse: scroll down", mouse = "scroll-down" }
"/mk" = { name = "Mouse: scroll up", mouse = "scroll-up" }

# Hint labels: type the chord, then the yellow label's letters, release Space to click it
";" = { name = "Click (hints)", hints = "click" }
"'" = { name = "Right-click (hints)", hints = "right-click" }
