# Global chords work in every app. Start them with a symbol so they never clash with app chords.
#   /<letter>  switch to an app (its next window if it's already in front), start it if it isn't running
name = "Global"

# The panel lists these as a reminder while you type.
[groups]
"/w" = "Window"
"/d" = "Desktop"
"/s" = "System"
"/v" = "Media"
"/m" = "Mouse"
"/t" = "Tab"

[chords]
# Apps
"/a" = { name = "Antigravity", focus = "antigravity ide.exe", launch = 'start "" "%LOCALAPPDATA%\Programs\Antigravity IDE\Antigravity IDE.exe"' }
"/t" = { name = "Windows Terminal", focus = "windowsterminal.exe", launch = "wt" }
"/c" = { name = "Chrome", focus = "chrome.exe", launch = "start chrome" }
"/f" = { name = "Firefox", focus = "firefox.exe", launch = "start firefox" }
"/p" = { name = "Postman", focus = "postman.exe", launch = 'start "" "%LOCALAPPDATA%\Postman\Postman.exe"' }
"/b" = { name = "Bruno", focus = "bruno.exe", launch = 'start "" "%LOCALAPPDATA%\Programs\Bruno\Bruno.exe"' }
"/q" = { name = "DBX (database)", focus = "dbx.exe", launch = 'start "" "%LOCALAPPDATA%\DBX\dbx.exe"' }
"/k" = { name = "Mattermost", focus = "mattermost.exe", launch = 'start "" "%ProgramFiles%\mattermost-desktop\Mattermost.exe"' }
"/o" = { name = "Outlook", focus = "outlook.exe", launch = "start outlook" }
"/g" = { name = "Everything (find files)", focus = "everything.exe", launch = 'start "" "%ProgramFiles(x86)%\Everything\Everything.exe"' }
"/=" = { name = "Notepad++", focus = "notepad++.exe", launch = "start notepad++" }
"/x" = { name = "Excel", focus = "excel.exe", launch = "start excel" }
"/w" = { name = "Word", focus = "winword.exe", launch = "start winword" }
"/e" = { name = "File Explorer (new window)", shortcut = "win+e" }

# Window layout on the monitor the window is on. Tap the last letter again for the next size
# (/wh h h: left 1/2, 2/3, 1/3), or another letter to switch layout (/wh l: right half).
"/wh" = { name = "Window: left (again: 2/3, 1/3)", window = "left", repeat = true }
"/wl" = { name = "Window: right (again: 2/3, 1/3)", window = "right", repeat = true }
"/wk" = { name = "Window: top (again: 2/3, 1/3)", window = "top", repeat = true }
"/wj" = { name = "Window: bottom (again: 2/3, 1/3)", window = "bottom", repeat = true }
"/wf" = { name = "Window: maximize / restore", window = "maximize", repeat = true }
"/wc" = { name = "Window: center", window = "center", repeat = true }
"/wp" = { name = "Window: padded focus", window = "padded", repeat = true }
"/wu" = { name = "Window: top-left quarter", window = "top-left", repeat = true }
"/wi" = { name = "Window: top-right quarter", window = "top-right", repeat = true }
"/wm" = { name = "Window: bottom-left quarter", window = "bottom-left", repeat = true }
"/w," = { name = "Window: bottom-right quarter", window = "bottom-right", repeat = true }
"/w1" = { name = "Window: left third", window = "left-third", repeat = true }
"/w2" = { name = "Window: middle third", window = "middle-third", repeat = true }
"/w3" = { name = "Window: right third", window = "right-third", repeat = true }
"/w4" = { name = "Window: left quarter column", window = "narrow-left", repeat = true }
"/w5" = { name = "Window: center half column", window = "wide-center", repeat = true }
"/w6" = { name = "Window: right quarter column", window = "narrow-right", repeat = true }
"/w[" = { name = "Window: left master (again: 1/4 middle, 1/4 right)", window = "left-master", repeat = true }
"/w]" = { name = "Window: right master (again: 1/4 middle, 1/4 left)", window = "right-master", repeat = true }
"/wn" = { name = "Window: restore / minimize", shortcut = "win+down", repeat = true }
"/wq" = { name = "Window: close", shortcut = "alt+f4" }

# Virtual desktops
# Win+Ctrl+Left/Right switch desktops; these take the window in front along (tap again to keep going).
"/dh" = { name = "Desktop: move window to previous", window = "previous-desktop", repeat = true }
"/dl" = { name = "Desktop: move window to next", window = "next-desktop", repeat = true }
"/dn" = { name = "Desktop: new", shortcut = "win+ctrl+d" }
"/dx" = { name = "Desktop: close", shortcut = "win+ctrl+f4" }

# System
"/ss" = { name = "Screenshot an area", shortcut = "win+shift+s" }
"/sv" = { name = "Clipboard history", shortcut = "win+v" }
"/se" = { name = "Emoji panel", shortcut = "win+." }
"/sl" = { name = "Lock the screen", shell = "rundll32.exe user32.dll,LockWorkStation" }
"/st" = { name = "Task Manager", shortcut = "ctrl+shift+esc" }
"/si" = { name = "Settings", shortcut = "win+i" }
"/sw" = { name = "Settings: Wi-Fi", shell = "start ms-settings:network-wifi" }
"/sb" = { name = "Settings: Bluetooth", shell = "start ms-settings:bluetooth" }
"/sd" = { name = "Settings: display", shell = "start ms-settings:display" }
"/sk" = { name = "Settings: sound", shell = "start ms-settings:sound" }
"/sn" = { name = "Notifications", shortcut = "win+n" }
"/sr" = { name = "Run dialog", shortcut = "win+r" }
"/sx" = { name = "Power-user menu", shortcut = "win+x" }
"/sh" = { name = "Hidden tray icons", shortcut = "win+b enter" }
"/r" = { name = "Translate the selection (DeepL)", shortcut = "ctrl+c ctrl+c" }

# Media
"/vj" = { name = "Volume down", shortcut = "volumedown", repeat = true }
"/vk" = { name = "Volume up", shortcut = "volumeup", repeat = true }
"/vm" = { name = "Mute", shortcut = "volumemute" }
"/vp" = { name = "Play / pause", shortcut = "playpause" }
"/vl" = { name = "Next track", shortcut = "nexttrack" }
"/vh" = { name = "Previous track", shortcut = "prevtrack" }

# Mouse at the pointer (Vim directions for scrolling)
"/mc" = { name = "Mouse: click", mouse = "click" }
"/mr" = { name = "Mouse: right-click", mouse = "right-click" }
"/md" = { name = "Mouse: double-click", mouse = "double-click" }
"/mm" = { name = "Mouse: middle-click", mouse = "middle-click" }
"/mj" = { name = "Mouse: scroll down", mouse = "scroll-down", repeat = true }
"/mk" = { name = "Mouse: scroll up", mouse = "scroll-up", repeat = true }
"/mh" = { name = "Mouse: scroll left", mouse = "scroll-left", repeat = true }
"/ml" = { name = "Mouse: scroll right", mouse = "scroll-right", repeat = true }
"/mp" = { name = "Mouse: back", mouse = "back" }
"/mn" = { name = "Mouse: forward", mouse = "forward" }
"/mt" = { name = "Go to top", shortcut = "ctrl+home" }
"/mb" = { name = "Go to bottom", shortcut = "ctrl+end" }
"/ms" = { name = "Mouse: pick scroll area (labels)", hints = "scroll" }

# Scroll with nothing typed: hold j/k/h/l to keep scrolling (Vim directions). No chord may start with these letters.
"j" = { name = "Scroll down (hold)", mouse = "scroll-down", repeat = true }
"k" = { name = "Scroll up (hold)", mouse = "scroll-up", repeat = true }
"h" = { name = "Scroll left (hold)", mouse = "scroll-left", repeat = true }
"l" = { name = "Scroll right (hold)", mouse = "scroll-right", repeat = true }

# Tabs: Chrome, Firefox, Antigravity (VS Code). Windows Terminal has its own in windows-terminal.toml.
"/th" = { name = "Tab: move left", shortcut = "ctrl+shift+pageup", repeat = true }
"/tl" = { name = "Tab: move right", shortcut = "ctrl+shift+pagedown", repeat = true }

# Hint labels: type the chord, then the label's letters, release Space to click it
";" = { name = "Click (labels)", hints = "click" }
"'" = { name = "Right-click (labels)", hints = "right-click" }
"[" = { name = "Middle-click / new tab (labels)", hints = "middle-click" }
"]" = { name = "Double-click / open file (labels)", hints = "double-click" }
"/;" = { name = "Taskbar: click (labels)", hints = "click", on = "taskbar" }
"/'" = { name = "Taskbar: right-click (labels)", hints = "right-click", on = "taskbar" }
