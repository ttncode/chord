name = "Windows Terminal"
app = "windowsterminal.exe"

[chords]
nt = { name = "New tab", shortcut = "ctrl+shift+t" }
cx = { name = "Close pane (closes the tab when it has one pane)", shortcut = "ctrl+shift+w" }
# Next/previous in tab order only if Settings > Interaction > "Tab switcher interface style" is "In order";
# with "Most recently used" they jump to the last-used tab.
tn = { name = "Next tab", shortcut = "ctrl+tab" }
tp = { name = "Previous tab", shortcut = "ctrl+shift+tab" }
sv = { name = "Split pane right", shortcut = "alt+shift+plus" }
sh = { name = "Split pane down", shortcut = "alt+shift+-" }
